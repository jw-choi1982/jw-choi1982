<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 인테리어 변환 서비스</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI 인테리어 변환</h1>
            <p>당신의 공간을 AI와 함께 새롭게 디자인해보세요.</p>
        </header>

        <main>
            <!-- 입력 섹션 -->
            <section id="input-section" class="active">
                <div class="card">
                    <div class="drop-zone" id="drop-zone">
                        <input type="file" id="image-upload" accept="image/*" hidden>
                        <div class="upload-placeholder" id="upload-placeholder">
                            <svg class="camera-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <p>사진을 클릭하거나 드래그하여 업로드하세요</p>
                        </div>
                        <img id="preview-image" src="" alt="미리보기" class="hidden">
                    </div>

                    <div class="control-group">
                        <label for="style-select">인테리어 스타일</label>
                        <select id="style-select">
                            <option value="modern">모던 (Modern)</option>
                            <option value="wood">우드톤 (Wood Tone)</option>
                            <option value="minimalist">미니멀리스트 (Minimalist)</option>
                            <option value="industrial">인더스트리얼 (Industrial)</option>
                            <option value="scandinavian">스칸디나비아 (Scandinavian)</option>
                        </select>
                    </div>

                    <button id="transform-btn" class="btn-primary" disabled>변환하기</button>
                </div>
            </section>

            <!-- 로딩 섹션 -->
            <div id="loading-section" class="loading-section hidden">
                <div class="spinner"></div>
                <p class="loading-text">
                    AI가 공간을 분석하고 멋진 인테리어를 디자인하고 있습니다...<br>
                    <span style="font-size: 13px; color: var(--text-muted);">(약 10~20초 정도 소요됩니다)</span>
                </p>
            </div>
            
                    
            
            </section>

            <!-- 결과 섹션 -->
            <section id="result-section" class="hidden">
                <div class="result-card">
                    <h2>변환 결과</h2>
                    <div class="result-image-container">
                        <img id="result-image" src="" alt="변환된 결과 이미지">
                    </div>
                    <div class="btn-group">
                        <button id="download-btn" class="btn-secondary">이미지 저장</button>
                        <button id="retry-btn" class="btn-outline">다시 하기</button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 AI Interior Designer. All rights reserved.</p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>
</html>
